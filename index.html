<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finnish Verb Picture Game</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#1d2433;--muted:#6b7280;--accent:#1f6feb;--ok:#1a9b4b;--bad:#d1342f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:16px}
  .wrap{width:100%;max-width:560px}
  h1{font-size:1.4rem;margin:.2em 0 .6em;text-align:center}
  .card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  button{font:inherit;cursor:pointer;border:2px solid #d5d9e0;background:#fff;border-radius:12px;padding:12px 14px;color:var(--text)}
  button:hover:not(:disabled){border-color:var(--accent)}
  .modes{display:grid;gap:10px;margin:14px 0}
  .modes button{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .row{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;margin-bottom:10px}
  .pic{height:280px;display:flex;align-items:center;justify-content:center;background:#eef0f4;border-radius:12px;overflow:hidden}
  .pic img{max-width:100%;max-height:100%;object-fit:contain}
  .missing{color:var(--muted);text-align:center;padding:10px;font-size:.9rem;word-break:break-all}
  .hint{text-align:center;color:var(--muted);margin:10px 0 0;min-height:1.4em}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .opts button{font-size:1.1rem;font-weight:600}
  .opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .opts button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
  .next{width:100%;margin-top:14px;background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .score{font-size:3rem;text-align:center;margin:10px 0}
  label{display:block;margin-top:10px;color:var(--muted);font-size:.95rem}
  textarea{width:100%;height:260px;font-family:monospace;font-size:.85rem}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🇫🇮 Guess the Finnish Verb</h1>

  <!-- MENU -->
  <div class="card" id="menu">
    <p>A picture appears. Pick the correct Finnish verb from 4 answers.</p>
    <div class="modes">
      <button data-mode="1">Game 1 – Verb type 1</button>
      <button data-mode="2">Game 2 – Verb type 2</button>
      <button data-mode="3">Game 3 – Verb type 3</button>
      <button data-mode="all">Game 4 – Type 1 + 2 + 3 together</button>
    </div>
    <label><input type="checkbox" id="optHint"> Show English meaning as a hint</label>
    <label>Questions per round:
      <select id="optCount"><option>10</option><option>20</option><option value="0">All verbs</option></select>
    </label>
    <label><button id="btnNames" style="padding:6px 10px;margin-top:6px">Show expected picture file names</button></label>
    <textarea id="names" class="hide" readonly></textarea>
    <label><button id="btnCheck" style="padding:6px 10px;margin-top:6px">Check all pictures (find missing)</button></label>
    <textarea id="report" class="hide" readonly></textarea>
  </div>

  <!-- GAME -->
  <div class="card hide" id="game">
    <div class="row"><span id="qno"></span><span id="sc"></span></div>
    <div class="pic" id="pic"></div>
    <div class="hint" id="hint"></div>
    <div class="opts" id="opts"></div>
    <button class="next hide" id="next">Next ➜</button>
  </div>

  <!-- RESULT -->
  <div class="card hide" id="result">
    <h2 style="text-align:center">Round finished</h2>
    <div class="score" id="final"></div>
    <button class="next" id="again">Back to menu</button>
  </div>
</div>

<script>
/* =========================================================
   EDIT HERE
   ---------------------------------------------------------
   IMG_DIR : folder with your pictures (next to index.html)
   IMG_EXT : picture file extension
   Each verb: { fi: "finnish verb", en: "english meaning" }
   Picture file = IMG_DIR + slug(fi) + IMG_EXT
   slug = lowercase, ä->a, ö->o, spaces->_   (kävellä -> kavella.png)
   To use a custom file name for one verb add:  img: "my-file.png"
   ========================================================= */
const IMG_DIR = "images/";
const IMG_EXT = ".png";

const TYPE1 = [
 {fi:"ajaa",en:"to drive"},{fi:"nauraa",en:"to laugh"},{fi:"maksaa",en:"to pay"},{fi:"ostaa",en:"to buy"},
 {fi:"varastaa",en:"to steal"},{fi:"asua",en:"to live (reside)"},{fi:"saunoa",en:"to sauna"},{fi:"itkeä",en:"to cry"},
 {fi:"puhua",en:"to speak"},{fi:"kasvaa",en:"to grow"},{fi:"tanssia",en:"to dance"},{fi:"katsoa",en:"to watch"},
 {fi:"istua",en:"to sit"},{fi:"seisoa",en:"to stand"},{fi:"laulaa",en:"to sing"},{fi:"matkustaa",en:"to travel"},
 {fi:"rakastaa",en:"to love"},{fi:"juhlia",en:"to party"},{fi:"riisua",en:"to undress"},{fi:"laskea",en:"to count"},
 {fi:"ratsastaa",en:"to ride a horse"},{fi:"sanoa",en:"to say"},{fi:"paistaa",en:"to fry/bake"},{fi:"metsästää",en:"to hunt"},
 {fi:"kalastaa",en:"to fish"},{fi:"sienestää",en:"to pick mushrooms"},{fi:"kysyä",en:"to ask"},{fi:"ampua",en:"to shoot"},
 {fi:"antaa",en:"to give"},{fi:"hiihtää",en:"to ski"},{fi:"hypätä",en:"to jump"},{fi:"jakaa",en:"to share/deliver"},
 {fi:"kertoa",en:"to tell"},{fi:"kirjoittaa",en:"to write"},{fi:"kylpeä",en:"to bathe"},{fi:"leipoa",en:"to bake"},
 {fi:"lentää",en:"to fly"},{fi:"lukea",en:"to read"},{fi:"lähteä",en:"to leave"},{fi:"löytää",en:"to find"},
 {fi:"näyttää",en:"to show"},{fi:"onkia",en:"to fish (with rod)"},{fi:"sataa",en:"to rain"},{fi:"saattaa",en:"to accompany"},
 {fi:"hoitaa",en:"to take care of"},{fi:"leikkiä",en:"to play"},{fi:"lohduttaa",en:"to comfort"},{fi:"miettiä",en:"to ponder"},
 {fi:"laittaa",en:"to put/cook"},{fi:"soutaa",en:"to row"},{fi:"vaihtaa",en:"to change"},{fi:"oppia",en:"to learn"},
 {fi:"ottaa",en:"to take"},{fi:"piirtää",en:"to draw"},{fi:"rakentaa",en:"to build"},{fi:"ymmärtää",en:"to understand"},
 {fi:"lähettää",en:"to send"},{fi:"palauttaa",en:"to return"},{fi:"istuttaa",en:"to plant"},{fi:"voittaa",en:"to win"},
 {fi:"varoittaa",en:"to warn"},{fi:"täyttää",en:"to fill"},{fi:"soittaa",en:"to call/play"},{fi:"odottaa",en:"to wait"},
 {fi:"muuttaa",en:"to move"},{fi:"nukkua",en:"to sleep"},{fi:"rikkoa",en:"to break"},{fi:"pilkkoa",en:"to chop"},
 {fi:"pudottaa",en:"to drop"},{fi:"pomppia",en:"to bounce"},{fi:"tappaa",en:"to kill"},{fi:"roikkua",en:"to hang"},
 {fi:"kantaa",en:"to carry"},{fi:"repiä",en:"to tear"},{fi:"saapua",en:"to arrive"},{fi:"tietää",en:"to know"},
 {fi:"pukea",en:"to dress"},{fi:"tukea",en:"to support"},{fi:"hakea",en:"to fetch"},
 {fi:"tuntea",en:"to feel"},{fi:"kääntää",en:"to turn"},{fi:"auttaa",en:"to help"},{fi:"huutaa",en:"to shout"},
 {fi:"viheltää",en:"to whistle"},{fi:"uskaltaa",en:"to dare"},{fi:"hiipiä",en:"to sneak"},{fi:"herättää",en:"to wake someone"}
];

const TYPE3 = [
 {fi:"juopotella",en:"to drink heavily"},{fi:"valehdella",en:"to lie"},{fi:"jutella",en:"to chat"},{fi:"keskustella",en:"to discuss"},
 {fi:"neuvotella",en:"to negotiate"},{fi:"työskennellä",en:"to work"},{fi:"ajatella",en:"to think"},{fi:"kastella",en:"to water"},
 {fi:"haista",en:"to smell (bad)"},{fi:"kohdella",en:"to treat"},{fi:"esitellä",en:"to introduce"},{fi:"teeskennellä",en:"to pretend"},
 {fi:"kuvitella",en:"to imagine"},{fi:"sovitella",en:"to mediate/try on"},{fi:"totella",en:"to obey"},{fi:"hikoilla",en:"to sweat"},
 {fi:"epäillä",en:"to suspect"},{fi:"tapella",en:"to fight"},{fi:"onnitella",en:"to congratulate"},{fi:"panna",en:"to put"},
 {fi:"hätäillä",en:"to panic/rush"},{fi:"haastatella",en:"to interview"},{fi:"opiskella",en:"to study"},{fi:"tulla",en:"to come"},
 {fi:"mennä",en:"to go"},{fi:"voimistella",en:"to do gymnastics"},{fi:"luistella",en:"to ice skate"},{fi:"pyöräillä",en:"to cycle"},
 {fi:"telttailla",en:"to camp in a tent"},{fi:"kävellä",en:"to walk"},{fi:"pestä",en:"to wash"},{fi:"nousta",en:"to rise/get up"},
 {fi:"lakaista",en:"to sweep"},{fi:"purra",en:"to bite"},{fi:"tuulla",en:"to be windy"},{fi:"kiroilla",en:"to swear"},
 {fi:"kokeilla",en:"to try/test"},{fi:"hymyillä",en:"to smile"},{fi:"rukoilla",en:"to pray"},{fi:"ulkoilla",en:"to be outdoors"},
 {fi:"juosta",en:"to run"},{fi:"lenkkeillä",en:"to jog"},{fi:"kuunnella",en:"to listen"},{fi:"suudella",en:"to kiss"},
 {fi:"riidellä",en:"to argue"},{fi:"kätellä",en:"to shake hands"},{fi:"palella",en:"to feel cold"},{fi:"herkutella",en:"to feast on treats"},
 {fi:"kuolla",en:"to die"},{fi:"seurustella",en:"to date"},{fi:"luulla",en:"to believe/think"},{fi:"kilpailla",en:"to compete"},
 {fi:"ommella",en:"to sew"},{fi:"kuvailla",en:"to describe"},{fi:"suunnitella",en:"to plan"},{fi:"ratkaista",en:"to solve"},
 {fi:"potkaista",en:"to kick"},{fi:"harjoitella",en:"to practice"},{fi:"ihailla",en:"to admire"},{fi:"pelleillä",en:"to joke around"},
 {fi:"palvella",en:"to serve"},{fi:"näytellä",en:"to act"},{fi:"laskettella",en:"to ski downhill"},{fi:"haukotella",en:"to yawn"},
 {fi:"kuntoilla",en:"to keep fit"},{fi:"soitella",en:"to phone around"},{fi:"hemmotella",en:"to pamper"},{fi:"askarrella",en:"to craft"},
 {fi:"venytellä",en:"to stretch"},{fi:"ihmetellä",en:"to wonder"}
];

const TYPE2 = [
 {fi:"arvioida",en:"to estimate"},{fi:"aterioida",en:"to have a meal"},{fi:"epäröidä",en:"to hesitate"},{fi:"haravoida",en:"to rake"},
 {fi:"ikävöidä",en:"to miss (someone)"},{fi:"imuroida",en:"to vacuum"},{fi:"jäädä",en:"to stay"},{fi:"juoda",en:"to drink"},
 {fi:"kopioida",en:"to copy"},{fi:"kritisoida",en:"to criticise"},{fi:"käydä",en:"to visit / to go"},{fi:"lapioida",en:"to shovel"},
 {fi:"luennoida",en:"to lecture"},{fi:"luoda",en:"to create"},{fi:"lyödä",en:"to hit"},{fi:"myydä",en:"to sell"},
 {fi:"nähdä",en:"to see"},{fi:"organisoida",en:"to organise"},{fi:"paketoida",en:"to wrap / pack"},{fi:"patikoida",en:"to hike"},
 {fi:"pysäköidä",en:"to park"},{fi:"remontoida",en:"to renovate"},{fi:"saada",en:"to get / receive"},{fi:"salamoida",en:"to flash (lightning)"},
 {fi:"siivilöidä",en:"to strain / sift"},{fi:"soida",en:"to sound / play (music)"},{fi:"suoda",en:"to grant / allow"},{fi:"syödä",en:"to eat"},
 {fi:"tapetoida",en:"to wallpaper"},{fi:"tehdä",en:"to do / make"},{fi:"tuoda",en:"to bring"},{fi:"tupakoida",en:"to smoke"},
 {fi:"uida",en:"to swim"},{fi:"valikoida",en:"to select"},{fi:"viedä",en:"to take (away)"},{fi:"viipaloida",en:"to slice"}
];
/* ======================= END OF EDIT AREA ======================= */

const slug = s => s.toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/å/g,"a").replace(/\s+/g,"_");
/* ---- YOUR REAL PICTURE FILES (exact names + extensions) ----
   Add / rename a file here when you change a picture.            */
const FILES = `
Ajaa.webp Ampua.jpg Antaa.jpg Kalastaa.jpg Sienestaa.jpg Asua.jpg Auttaa.jpg Hakea.jpg Herattaa.jpeg Hiihtaa.jpg Hiipia.webp Hoitaa.webp Huuhtaa.jpg
Hyppia.webp Istua.webp Istuttaa.webp Itkea.jpg Jakaa.jpeg Juhlja.jpg Kaantaa.webp Kantaa.jpg Kasvaa.webp Katsoa.jpg
Kertoa.webp Kirjoittaa.jpeg Kylpea.webp Kysya.jpg Lahettaa.jpg Lahtaa.jpg Laittaa.gif Laskea.png Laulaa.jpg Leikkia.jpg
Leipoa.webp Lentaa.jpg Lohduttaa.jpeg Loytaa.png Lukea.avif Maksaa.jpg Matkustaa.jpg Meittaa.jpg Metsastaa.jpeg Muuttaa.jpg
Nauraa.avif Nayttaa.jpg Nukkua.jpg Odottaa.png Onkia.webp Oppia.jpg Ostaa.webp Ottaa.png Paistaa.webp Palauttaa.jpg
Piirtaa.jpeg Pilkkoa.avif Pompia.jpg Pudottaa.webp Puhua.webp Pukea.jpeg Rakastaa.jpg Rakentaa.jpg Ratsastaa.jpg Repia.jpg
Riisua.avif Rikkoa.png Roikkua.webp Saapua.webp Saattaa.jpg Sanoa.webp Sataa.jpg Saunoa.webp Seisoa.jpg Soittaa.webp
Souttaa.jpg Tanssia.jpg Tappaa.jpg Tayttaa.webp Tietaa.gif Tukea.png Tuntea.jpg Uskaltaa.webp Vaihtaa.png Varastaa.avif
Varoitta.webp Viheltaa.webp Voittaa.jpg Ymmartaa.png
Ajatella.jpg Askarrella.webp Epailla.jpg Esitella.jpg Haastatella.jpg Haista.jpg Harjoitella.png Hatailla.webp
Haukotella.jpg Hemmotella.jpg Herkutella.jpg Hikoilla.avif Hymyilla.png Ihailla.webp Ihmetella.jpg Juopotella.jpg
Juosta.jpg Jutella.avif Kastella.jpg Katella.jpg Kavella.jpg Keskustella.jpg Kilpailla.jpg Kiroilla.avif Kohdella.png
Kokeilla.webp Kuntoilla.jpg Kuolla.webp Kuunnella.jpg Kuvailla.webp Kuvitella.avif Lakaista.avif Lenkkeilla.avif
Luistella.avif Luskettella.jpg Luulla.webp Menna.jpg Naytella.jpg Neuvotella.webp Nousta.png Ommella.webp Onnitella.jpg
Opiskella.jpg Palella.webp Palvella.webp Panna.jpeg Pelleilla.jpg Pesta.jpg Potkaista.jpg Purra.jpg Pyorailla.jpg
Ratkaista.jpg Riidella.jpg Rukoilla.jpg Seurustella.jpg Soitella.avif Sovitella.jpg Suudella.jpg Suunnitella.avif
Tapella.avif Teeskennella.jpg Telttailla.jpg Totella.jpg Tulla.webp Tuulla.jpg Tyoskennella.jpg Ulkoilla.webp
Valehdella.avif Vanytella.webp Voimistella.jpg
Arvioida.webp Aterioida.webp Eparoida.jpg Haravoida.jpg Ikavoida.webp Imuroida.jpg Jaada.webp Juoda.jpg Kayda.png Kopioida.jpg
Kritisoida.webp Lapioida.jpg Luennoida.jpg Luoda.jpg Lyoda.jpg Myyda.webp Nahda.png Organisoida.webp Paketoida.jpeg Patikoida.jpg
Pysakoida.webp Remontoida.jpg Saada.jpg Salamoida.jpg Siivitoida.webp Soida.jpg Suoda.jpg Syoda.jpg Tapetoida.jpg Tehda.jpg
Tuoda.jpg Tupakoida.jpg Uida.jpg Valikoida.jpg Vieda.png Viipaloida.jpeg
`.trim().split(/\s+/);

// file names that are spelled differently from the verb  (verb -> file name without extension)
const ALIASES = {
  "hypätä":"hyppia", "juhlia":"juhlja", "huutaa":"huuhtaa", "kääntää":"kaantaa", "lähteä":"lahtaa",
  "miettiä":"meittaa", "pomppia":"pompia", "soutaa":"souttaa", "varoittaa":"varoitta",
  "lohduttaa":"lohdutta", "siivilöidä":"siivitoida", "laskettella":"luskettella", "venytellä":"vanytella"
};

const FILE_LOOKUP = {};                       // "ajaa" -> "Ajaa.webp"
FILES.forEach(f => { FILE_LOOKUP[f.replace(/\.[^.]+$/,"").toLowerCase()] = f; });

const imgPath = v => {
  if (v.img) return IMG_DIR + v.img;          // optional per-verb override
  const key = ALIASES[v.fi] || slug(v.fi);
  return IMG_DIR + (FILE_LOOKUP[key] || (key + IMG_EXT));
};
/* If the exact file is not found, try other folders, capital/lowercase and extensions */
function candidates(v){
  const first = imgPath(v);
  const names = [];
  [ALIASES[v.fi], slug(v.fi)].forEach(k=>{ if(k){ names.push(k.charAt(0).toUpperCase()+k.slice(1), k); } });
  const dirs = [IMG_DIR, "images/", "Images/", "", "./"];
  const exts = ["jpg","jpeg","png","webp","avif","gif","jfif","JPG","JPEG","PNG","WEBP"];
  const list=[first];
  dirs.forEach(d=>[...new Set(names)].forEach(n=>exts.forEach(e=>list.push(d+n+"."+e))));
  return [...new Set(list)];
}
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

let pool=[], questions=[], idx=0, score=0, answered=false;

function show(id){ ["menu","game","result"].forEach(x=>$(x).classList.toggle("hide",x!==id)); }

/* Shuffle bag: every verb is used once before any verb repeats.
   The bag is remembered per game (in this browser), so new rounds
   always start with verbs you have not seen yet. */
function draw(mode, pool, n){
  const key = "verbbag_"+mode;
  const names = pool.map(v=>v.fi);
  let bag = [];
  try { bag = JSON.parse(localStorage.getItem(key)||"[]").filter(x=>names.includes(x)); } catch(e){}
  const picked = [];
  while (picked.length < n) {
    if (bag.length === 0) {
      // refill with a fresh shuffle, keeping already-picked verbs out of this round
      bag = shuffle(names.filter(x=>!picked.includes(x)));
      if (bag.length === 0) break;
    }
    picked.push(bag.shift());
  }
  try { localStorage.setItem(key, JSON.stringify(bag)); } catch(e){}
  return shuffle(picked.map(f=>pool.find(v=>v.fi===f)));
}

function start(mode){
  pool = mode==="1" ? TYPE1 : mode==="2" ? TYPE2 : mode==="3" ? TYPE3 : TYPE1.concat(TYPE2, TYPE3);
  const n = parseInt($("optCount").value,10) || pool.length;
  questions = draw(mode, pool, n);
  idx=0; score=0; show("game"); ask();
}

function ask(){
  answered=false;
  const q = questions[idx];
  $("qno").textContent = "Question "+(idx+1)+" / "+questions.length;
  $("sc").textContent = "Score: "+score;
  $("hint").textContent = $("optHint").checked ? "Hint: "+q.en : "";
  $("next").classList.add("hide");
  const pic=$("pic"); pic.innerHTML="";
  const im=new Image(); im.alt=q.fi;
  const tries=candidates(q); let t=0;
  im.onerror=()=>{
    t++;
    if(t<tries.length){ im.src=tries[t]; }
    else { pic.innerHTML='<div class="missing">Picture not found. Tried:<br>'+tries.slice(0,3).join("<br>")+'<br>…and '+(tries.length-3)+' other folder/case/extension combinations</div>'; }
  };
  im.src=tries[0];
  pic.appendChild(im);
  const wrong = shuffle(pool.filter(v=>v.fi!==q.fi)).slice(0,3);
  const opts = shuffle([q].concat(wrong));
  const box=$("opts"); box.innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button"); b.textContent=o.fi;
    b.onclick=()=>pick(b,o,q); box.appendChild(b);
  });
}

function pick(btn,o,q){
  if(answered) return; answered=true;
  const correct = o.fi===q.fi;
  if(correct){ score++; btn.classList.add("ok"); } else {
    btn.classList.add("bad");
    [...$("opts").children].forEach(b=>{ if(b.textContent===q.fi) b.classList.add("ok"); });
  }
  $("sc").textContent="Score: "+score;
  $("hint").textContent = q.fi+" = "+q.en;
  $("next").textContent = idx+1<questions.length ? "Next ➜" : "See result";
  $("next").classList.remove("hide");
}

$("next").onclick=()=>{
  idx++;
  if(idx<questions.length) ask();
  else { $("final").textContent=score+" / "+questions.length; show("result"); }
};
$("again").onclick=()=>show("menu");
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>start(b.dataset.mode));
$("btnNames").onclick=()=>{
  const t=$("names"); t.classList.toggle("hide");
  t.value = "TYPE 1\n"+TYPE1.map(imgPath).join("\n")+"\n\nTYPE 2\n"+TYPE2.map(imgPath).join("\n")+"\n\nTYPE 3\n"+TYPE3.map(imgPath).join("\n");
};

/* Checks every verb's picture and lists the ones that are missing or found under a different name */
$("btnCheck").onclick=async()=>{
  const r=$("report"); r.classList.remove("hide"); r.value="Checking "+(TYPE1.length+TYPE2.length+TYPE3.length)+" pictures...";
  const test=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(true);i.onerror=()=>res(false);i.src=src;});
  const all=TYPE1.map(v=>["T1",v]).concat(TYPE2.map(v=>["T2",v]), TYPE3.map(v=>["T3",v]));
  const out=await Promise.all(all.map(async([t,v])=>{
    const c=candidates(v);
    for(let k=0;k<c.length;k++){ if(await test(c[k])) return {t,v,found:c[k],exact:k===0}; }
    return {t,v,found:null,exact:false};
  }));
  const missing=out.filter(o=>!o.found), moved=out.filter(o=>o.found&&!o.exact);
  r.value="OK exact: "+out.filter(o=>o.exact).length+" / "+out.length+"\n\n"+
   "MISSING ("+missing.length+") - no picture found:\n"+missing.map(o=>o.t+" "+o.v.fi+"  (expected "+imgPath(o.v)+")").join("\n")+"\n\n"+
   "FOUND UNDER A DIFFERENT NAME/TYPE ("+moved.length+") - fix in FILES:\n"+moved.map(o=>o.t+" "+o.v.fi+"  expected "+imgPath(o.v)+"  found "+o.found).join("\n");
};
</script>
</body>
</html>
